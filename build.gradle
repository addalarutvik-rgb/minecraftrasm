plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group

repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        rasmclient {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }

// Standalone Java desktop installer with the exact remapped client embedded.
sourceSets { installer }
tasks.register('installerJar', Jar) {
    dependsOn tasks.named('installerClasses'), tasks.named('remapJar')
    archiveFileName = 'rasm-installer.jar'
    from sourceSets.installer.output
    from(tasks.named('remapJar').flatMap { it.archiveFile }) {
        into 'payload'
        rename { 'rasm-client.jar' }
    }
    manifest { attributes 'Main-Class': 'dev.rasm.installer.RasmInstaller' }
}
tasks.named('build') { dependsOn tasks.named('installerJar') }
